services:
  postgres:
    image: postgres:16-alpine
    container_name: vrtech-postgres
    restart: always
    environment:
      POSTGRES_USER: vrtech_user
      POSTGRES_PASSWORD: vrtech_password
      POSTGRES_DB: vrtech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrtech_user -d vrtech_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vrtech-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vrtech-api
    ports:
      - "3001:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://vrtech_user:vrtech_password@postgres:5432/vrtech_db
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: npm run dev

volumes:
  postgres_data:
  qdrant_storage: